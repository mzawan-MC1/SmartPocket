name: Desktop Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Optional release tag. Must match package.json version, for example v0.1.0.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: smartpocket-desktop-release-${{ github.event.inputs.releaseTag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Validate desktop release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-tag: ${{ steps.version.outputs.release_tag }}
      release-name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version wiring and derive release tag
        id: version
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.releaseTag || '' }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');

          const cargoVersionMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);
          if (!cargoVersionMatch) {
            throw new Error('Could not find version in src-tauri/Cargo.toml.');
          }

          const packageVersion = packageJson.version;
          const cargoVersion = cargoVersionMatch[1];
          const tauriVersion = tauriConfig.version;
          const expectedTag = `v${packageVersion}`;
          const refType = process.env.GITHUB_REF_TYPE || '';
          const refName = process.env.GITHUB_REF_NAME || '';
          const inputReleaseTag = (process.env.INPUT_RELEASE_TAG || '').trim();

          if (tauriVersion !== '../package.json') {
            throw new Error(`src-tauri/tauri.conf.json must use ../package.json as its version source. Found: ${tauriVersion}`);
          }

          if (cargoVersion !== packageVersion) {
            throw new Error(`src-tauri/Cargo.toml version (${cargoVersion}) must match package.json version (${packageVersion}).`);
          }

          let releaseTag = expectedTag;
          if (refType === 'tag') {
            releaseTag = refName;
          } else if (inputReleaseTag) {
            releaseTag = inputReleaseTag;
          }

          if (!/^v.+/.test(releaseTag)) {
            throw new Error(`Release tag must start with v. Received: ${releaseTag}`);
          }

          if (releaseTag !== expectedTag) {
            throw new Error(`Release tag ${releaseTag} does not match package.json version ${packageVersion}. Expected ${expectedTag}.`);
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `release_tag=${releaseTag}\n`);
          fs.appendFileSync(output, `release_name=Smart Pocket ${releaseTag}\n`);
          NODE

  build-windows:
    name: Build Windows installers
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Build NSIS and WiX installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release-tag }}
          releaseName: ${{ needs.prepare-release.outputs.release-name }}
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

  build-macos:
    name: Build macOS app and DMG
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Build macOS app and DMG
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare-release.outputs.release-tag }}
          releaseName: ${{ needs.prepare-release.outputs.release-name }}
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: --bundles app,dmg
