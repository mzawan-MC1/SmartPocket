name: Exchange Rate Sync

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      backfillFrom:
        description: 'Optional historical backfill start date (YYYY-MM-DD)'
        required: false
        type: string
      backfillTo:
        description: 'Optional historical backfill end date (YYYY-MM-DD)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: smartpocket-exchange-rate-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Exchange Rates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXCHANGE_RATE_SYNC_URL: https://1smartpocket.com/api/internal/exchange-rates/sync
      EXCHANGE_RATE_BACKFILL_URL: https://1smartpocket.com/api/internal/exchange-rates/backfill
      SYNC_SECRET: ${{ secrets.EXCHANGE_RATE_SYNC_SECRET }}
      MANUAL_BACKFILL_FROM: ${{ github.event.inputs.backfillFrom || '' }}
      MANUAL_BACKFILL_TO: ${{ github.event.inputs.backfillTo || '' }}

    steps:
      - name: Validate configuration and derive backfill range
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SYNC_SECRET}" ]]; then
            echo "EXCHANGE_RATE_SYNC_SECRET is not configured." >&2
            exit 1
          fi

          validate_date() {
            local value="$1"
            [[ "${value}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          }

          if [[ -n "${MANUAL_BACKFILL_FROM}" || -n "${MANUAL_BACKFILL_TO}" ]]; then
            if [[ -z "${MANUAL_BACKFILL_FROM}" || -z "${MANUAL_BACKFILL_TO}" ]]; then
              echo "Manual backfill requires both backfillFrom and backfillTo." >&2
              exit 1
            fi

            if ! validate_date "${MANUAL_BACKFILL_FROM}" || ! validate_date "${MANUAL_BACKFILL_TO}"; then
              echo "Manual backfill dates must use YYYY-MM-DD format." >&2
              exit 1
            fi

            python - "${MANUAL_BACKFILL_FROM}" "${MANUAL_BACKFILL_TO}" <<'PY'
          import datetime
          import sys

          date_from = datetime.date.fromisoformat(sys.argv[1])
          date_to = datetime.date.fromisoformat(sys.argv[2])

          if date_from > date_to:
              raise SystemExit("backfillFrom must be less than or equal to backfillTo.")

          days = (date_to - date_from).days + 1
          if days > 31:
              raise SystemExit("Manual backfill range cannot exceed 31 inclusive days.")
          PY

            backfill_from="${MANUAL_BACKFILL_FROM}"
            backfill_to="${MANUAL_BACKFILL_TO}"
            range_source="manual"
          else
            backfill_from="$(date -u -d '30 days ago' +%F)"
            backfill_to="$(date -u -d 'yesterday' +%F)"
            range_source="automatic"
          fi

          {
            echo "BACKFILL_FROM=${backfill_from}"
            echo "BACKFILL_TO=${backfill_to}"
            echo "BACKFILL_RANGE_SOURCE=${range_source}"
          } >> "${GITHUB_ENV}"

          {
            echo "## Exchange Rate Sync"
            echo ""
            echo "- Backfill range source: ${range_source}"
            echo "- Backfill dateFrom: ${backfill_from}"
            echo "- Backfill dateTo: ${backfill_to}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Sync latest exchange-rate snapshot
        shell: bash
        run: |
          set -euo pipefail

          latest_response="$(mktemp)"

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${SYNC_SECRET}" \
            --header "Accept: application/json" \
            --output "${latest_response}" \
            "${EXCHANGE_RATE_SYNC_URL}"

          python - "${latest_response}" "${GITHUB_ENV}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import pathlib
          import sys

          response_path = pathlib.Path(sys.argv[1])
          github_env = pathlib.Path(sys.argv[2])
          summary_path = pathlib.Path(sys.argv[3])

          payload = json.loads(response_path.read_text(encoding="utf-8"))

          required_fields = ["provider", "rateDate", "fetchedAt", "snapshotId"]
          if payload.get("success") is not True:
              raise SystemExit("Latest exchange-rate sync did not return success=true.")

          missing = [field for field in required_fields if not payload.get(field)]
          if missing:
              raise SystemExit(f"Latest exchange-rate sync response is missing required fields: {', '.join(missing)}")

          with github_env.open("a", encoding="utf-8") as handle:
              handle.write(f"LATEST_PROVIDER={payload['provider']}\n")
              handle.write(f"LATEST_RATE_DATE={payload['rateDate']}\n")
              handle.write(f"LATEST_FETCHED_AT={payload['fetchedAt']}\n")
              handle.write(f"LATEST_PROVIDER_TIMESTAMP={payload.get('providerTimestamp') or ''}\n")
              handle.write(f"LATEST_SNAPSHOT_ID={payload['snapshotId']}\n")
              handle.write(f"LATEST_RATE_COUNT={payload.get('rateCount', 0)}\n")

          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n### Latest Snapshot\n")
              handle.write(f"- Provider: {payload['provider']}\n")
              handle.write(f"- Rate date: {payload['rateDate']}\n")
              handle.write(f"- Fetched at: {payload['fetchedAt']}\n")
              if payload.get("providerTimestamp"):
                  handle.write(f"- Provider timestamp: {payload['providerTimestamp']}\n")
              handle.write(f"- Snapshot ID: {payload['snapshotId']}\n")
              handle.write(f"- Rate count: {payload.get('rateCount', 0)}\n")
          PY

      - name: Backfill historical exchange rates
        shell: bash
        run: |
          set -euo pipefail

          backfill_response="$(mktemp)"
          request_body="$(printf '{"dateFrom":"%s","dateTo":"%s"}' "${BACKFILL_FROM}" "${BACKFILL_TO}")"

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${SYNC_SECRET}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "${request_body}" \
            --output "${backfill_response}" \
            "${EXCHANGE_RATE_BACKFILL_URL}"

          python - "${backfill_response}" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import pathlib
          import sys

          response_path = pathlib.Path(sys.argv[1])
          summary_path = pathlib.Path(sys.argv[2])

          payload = json.loads(response_path.read_text(encoding="utf-8"))

          required_fields = ["provider", "dateFrom", "dateTo", "fetchedCount", "skippedExactCount", "failedCount"]
          if payload.get("success") is not True:
              raise SystemExit("Historical exchange-rate backfill did not return success=true.")

          missing = [field for field in required_fields if field not in payload]
          if missing:
              raise SystemExit(f"Historical exchange-rate backfill response is missing required fields: {', '.join(missing)}")

          if payload.get("failedCount", 0):
              raise SystemExit("Historical exchange-rate backfill reported failed dates.")

          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n### Historical Backfill\n")
              handle.write(f"- Provider: {payload['provider']}\n")
              handle.write(f"- dateFrom: {payload['dateFrom']}\n")
              handle.write(f"- dateTo: {payload['dateTo']}\n")
              handle.write(f"- Fetched dates: {payload.get('fetchedCount', 0)}\n")
              handle.write(f"- Exact snapshots already present: {payload.get('skippedExactCount', 0)}\n")
              handle.write(f"- Failed dates: {payload.get('failedCount', 0)}\n")
          PY
